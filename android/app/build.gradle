// App de Android de Yo Soy Listo: la web dentro de un WebView propio (MainActivity), a pantalla completa.
plugins {
    id 'com.android.application'
}

def keystore = System.getenv('KEYSTORE_PATH')

android {
    namespace 'es.yosoylisto.app'
    compileSdk 36

    defaultConfig {
        applicationId 'es.yosoylisto.app'
        minSdk 24
        targetSdk 36
        versionCode((System.getenv('VERSION_CODE') ?: '1') as int)
        versionName(System.getenv('VERSION_NAME') ?: '1.0.0')

        resValue 'string', 'appName', 'Yo Soy Listo'
    }

    signingConfigs {
        if (keystore) {
            release {
                storeFile file(keystore)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias 'upload'
                keyPassword System.getenv('KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystore) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        resValues true
    }
}

dependencies {
    implementation 'androidx.core:core:1.16.0'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.core:core-splashscreen:1.0.1'
}
