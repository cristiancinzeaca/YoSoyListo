# Construye la app de Android (WebView propio) y la deja en Releases → «android-latest».
# Firma con android/upload.jks.enc (cifrada) + secreto ANDROID_KEYSTORE_PASSWORD; sin él, solo sale un APK de prueba.
name: Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Clave de firma
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # La clave de subida va cifrada en el repo (android/upload.jks.enc); la contraseña es el secreto ANDROID_KEYSTORE_PASSWORD.
          if [ -n "$KEYSTORE_PASSWORD" ] && [ -f android/upload.jks.enc ]; then
            KP=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d ' \r\n\t')
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in android/upload.jks.enc -out "$RUNNER_TEMP/upload.jks" -pass "pass:$KP" \
              || { echo "::error::No se pudo descifrar la clave: revisa el secreto ANDROID_KEYSTORE_PASSWORD"; exit 1; }
            echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "::add-mask::$KP"
            echo "KEYSTORE_PASSWORD=$KP" >> "$GITHUB_ENV"
            echo "Firmado con la clave de subida."
          else
            echo "Sin clave de firma: solo APK de prueba."
          fi

      - name: Compilar
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          if [ -n "$KEYSTORE_PATH" ]; then
            gradle --no-daemon :app:bundleRelease :app:assembleRelease
          else
            gradle --no-daemon :app:assembleDebug
          fi
          mkdir -p ../out
          find app/build/outputs -name '*.aab' -exec cp {} ../out/yosoylisto.aab \; || true
          find app/build/outputs/apk -name '*.apk' -exec cp {} ../out/yosoylisto.apk \; || true
          ls -la ../out

      - name: Huella SHA-256 de la firma (para assetlinks.json)
        if: env.KEYSTORE_PATH != ''
        run: keytool -list -v -keystore "$KEYSTORE_PATH" -alias upload -storepass "$KEYSTORE_PASSWORD" | grep 'SHA256:' | tee out/sha256.txt

      - name: Publicar en Releases (android-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest out/* --prerelease --title "Android 1.0.${{ github.run_number }}" \
            --notes "App de Android de Yo Soy Listo (versión ${{ github.run_number }}). yosoylisto.aab → Google Play · yosoylisto.apk → instalar en el móvil para probar."
